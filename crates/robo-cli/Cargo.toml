[package]
name = "robo-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "robo"
path = "src/main.rs"

[dependencies]
anstyle = "1"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
console = "0.15"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
