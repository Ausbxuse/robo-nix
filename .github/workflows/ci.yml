name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Check Formatting
        run: nix fmt -- --check .

      - name: Run Full Validation
        run: bash tests/full-check.sh

  activation-shells:
    name: Activation Shells (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Run Shell Validation
        run: bash tests/shell-validation.sh

  container-smoke:
    name: Container Smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Container Smoke
        env:
          ROBO_NIX_CONTAINER_IMAGE: ${{ matrix.image }}
          ROBO_NIX_CONTAINER_RUNTIME: docker
        run: bash tests/container-smoke.sh

  eval-darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Run Library Regression Tests
        run: bash tests/regression-api.sh

      - name: Show Flake Outputs
        run: nix flake show --all-systems
