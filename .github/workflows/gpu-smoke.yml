name: GPU Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  gpu-smoke:
    runs-on:
      - self-hosted
      - linux
      - x64
      - gpu
      - nvidia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Run CUDA Check
        run: nix run .#cuda-check

      - name: Run GPU Validation
        run: bash tests/gpu-validation.sh
